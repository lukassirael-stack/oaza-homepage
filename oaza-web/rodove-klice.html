<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rodové klíče™ — Terapie pro šťastný život | Oáza Adamanthea</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Rodové klíče™ — Terapie pro šťastný život">
<meta property="og:url" content="https://oaza-adamanthea.cz/rodove-klice">
<meta property="og:locale" content="cs_CZ">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Osvoboďte se od omezujících vzorců svých předků. Rodové klíče™ — jednoduchá a účinná terapie odemkne dary vašeho rodu. Více než 2500 klientů, 15 let zkušeností.">
<meta name="theme-color" content="#faf3e7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="/img/rodove-klice-strom.webp" type="image/webp">
<style>
  /* ============ ROOT (LIGHT THEME) ============ */
  :root{
    /* Background — warm cream / parchment */
    --bg-cream: #faf3e7;
    --bg-warm: #f5ead5;
    --bg-sand: #ede0c4;
    --bg-card: #fdf8ec;


    /* Gold accents (deeper for contrast on light bg) */
    --gold: #b8924a;
    --gold-deep: #8a6a32;
    --gold-bright: #d4a857;
    --gold-soft: #c9a868;
    --gold-glow: rgba(184, 146, 74, 0.25);


    /* Brown / earth tones */
    --brown-deep: #4a3520;
    --brown: #6b4d2e;
    --brown-soft: #8a6f4f;
    --brown-light: #b59a76;


    /* Text */
    --text: #4a3520;
    --text-soft: #6b5538;
    --text-muted: #8a7558;
    --ivory: #faf3e7;


    /* Lines */
    --line: rgba(138, 106, 50, 0.2);
    --line-soft: rgba(138, 106, 50, 0.1);


    --display: 'Cinzel', serif;
    --serif: 'Cormorant Garamond', serif;
    --sans: 'Cinzel', serif;


    --tree-img: url('/img/rodove-klice-strom.webp');
  }


  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  [id]{scroll-margin-top: 84px}
  body{
    font-family: var(--serif);
    background: var(--bg-cream);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }


  /* ============ AMBIENT BACKGROUND ============ */
  .bg-ambient{
    position: fixed; inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(212, 168, 87, 0.18), transparent 50%),
      radial-gradient(ellipse at 85% 85%, rgba(181, 154, 118, 0.22), transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(250, 243, 231, 0.5), transparent 70%),
      linear-gradient(180deg, var(--bg-cream) 0%, var(--bg-warm) 50%, var(--bg-cream) 100%);
  }


  /* Subtle paper grain via SVG noise */
  .bg-grain{
    position: fixed; inset: 0;
    z-index: 1; pointer-events: none;
    opacity: 0.4;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.20  0 0 0 0.08 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: multiply;
  }


  /* Soft glow orbs */
  .glow{
    position: fixed; z-index: 1; pointer-events: none;
    border-radius: 50%;
    opacity: 0.5;
  }
  .glow-1{
    top: -200px; right: -100px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(212, 168, 87, 0.28) 0%, rgba(212, 168, 87, 0.12) 40%, transparent 68%);
  }
  .glow-2{
    bottom: -200px; left: -100px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(181, 154, 118, 0.32) 0%, rgba(181, 154, 118, 0.14) 40%, transparent 68%);
  }


  /* ============ CONTAINER ============ */
  .wrap{
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
  }


  /* ============ HOOK BANNER ============ */
  .hook{
    position: relative;
    z-index: 10;
    padding: 28px 24px;
    text-align: center;
    background: linear-gradient(90deg, transparent 0%, rgba(184, 146, 74, 0.12) 30%, rgba(184, 146, 74, 0.12) 70%, transparent 100%);
    border-bottom: 1px solid var(--line);
  }
  .hook-inner{
    max-width: 980px;
    margin: 0 auto;
    font-family: var(--serif);
    font-size: clamp(1.05rem, 1.8vw, 1.35rem);
    line-height: 1.5;
    color: var(--brown-deep);
    font-style: italic;
    font-weight: 500;
  }
  .hook-inner strong{
    color: var(--gold-deep);
    font-style: normal;
    font-weight: 700;
    font-family: var(--display);
    font-size: 0.92em;
    letter-spacing: 0.03em;
  }
  .hook-mark{
    display: inline-block;
    color: var(--gold);
    font-size: 1.4em;
    margin: 0 10px;
    vertical-align: middle;
    line-height: 0;
  }


  /* ============ HERO (organic split: text in sky + text in roots) ============ */
  .hero{
    position: relative;
    min-height: 760px;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
    isolation: isolate;
  }
  .hero-bg{
    position: absolute;
    inset: 0;
    z-index: -2;
    background:
      var(--tree-img) center/cover no-repeat,
      linear-gradient(180deg, #332412 0%, #4a3520 55%, #6b4d2e 100%);
    animation: heroZoom 20s ease-out forwards;
  }
  @keyframes heroZoom{
    from{transform: scale(1.06)}
    to{transform: scale(1)}
  }


  /* TOP BAND - text "in the sky/canopy" */
  .hero-top{
    position: relative;
    z-index: 2;
    padding: 70px 24px 50px;
    text-align: center;
    flex-shrink: 0;
  }
  /* Dark gradient backdrop for text contrast against bright canopy */
  .hero-top::before{
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100%;
    background:
      radial-gradient(ellipse 70% 60% at center, rgba(30, 20, 10, 0.55) 0%, rgba(30, 20, 10, 0.32) 42%, transparent 68%);
    z-index: -1;
    pointer-events: none;
  }


  /* MIDDLE - visible trunk + sun */
  .hero-middle{
    flex-grow: 1;
    min-height: 240px;
    position: relative;
  }


  /* BOTTOM BAND - "in the roots", solid cream card */
  .hero-bottom{
    position: relative;
    z-index: 2;
    padding: 56px 24px 60px;
    background:
      linear-gradient(180deg, transparent 0%, rgba(250, 243, 231, 0.8) 15%, rgba(250, 243, 231, 0.97) 38%, var(--bg-cream) 100%);
    text-align: center;
  }
  .hero-bottom-inner{
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 12px;
  }


  /* Ornament */
  .hero-ornament{
    width: 64px; height: 64px;
    margin: 0 auto 20px;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 0.2s forwards;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.7));
  }
  .hero-ornament svg{
    width: 100%; height: 100%;
    animation: slowRotate 80s linear infinite;
  }
  @keyframes slowRotate{
    from{transform: rotate(0deg)}
    to{transform: rotate(360deg)}
  }
  @keyframes fadeUp{
    from{opacity: 0; transform: translateY(20px)}
    to{opacity: 1; transform: translateY(0)}
  }
  @keyframes fadeIn{
    from{opacity: 0}
    to{opacity: 1}
  }


  /* TOP typography - needs strong cream halo for legibility on image */
  .eyebrow{
    font-family: var(--display);
    font-size: 0.82rem;
    letter-spacing: 0.4em;
    color: #f0c878;
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 0.4s forwards;
    text-shadow:
      0 1px 2px rgba(0, 0, 0, 0.95),
      0 0 10px rgba(0, 0, 0, 0.85),
      0 0 24px rgba(20, 14, 8, 0.7);
  }
  .eyebrow::before{
    content: '\2726';
    margin-right: 14px;
    color: #f0c878;
    font-size: 0.7em;
  }
  .eyebrow::after{
    content: '\2726';
    margin-left: 14px;
    color: #f0c878;
    font-size: 0.7em;
  }
  h1{
    font-family: var(--display);
    font-size: clamp(2.4rem, 5.5vw, 4.2rem);
    font-weight: 600;
    line-height: 1.05;
    color: #faf3e7;
    letter-spacing: 0.03em;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 0.6s forwards;
    text-shadow:
      0 2px 4px rgba(0, 0, 0, 0.95),
      0 0 16px rgba(0, 0, 0, 0.9),
      0 0 36px rgba(20, 14, 8, 0.8),
      0 4px 12px rgba(0, 0, 0, 0.7);
  }
  h1 .tm{
    font-size: 0.4em;
    vertical-align: top;
    color: #f0c878;
    letter-spacing: 0;
    margin-left: 4px;
  }
  h1 .gold-line{
    display: block;
    color: #f0c878;
    font-style: italic;
    font-family: var(--serif);
    font-weight: 500;
    font-size: 0.42em;
    letter-spacing: 0.06em;
    margin-top: 14px;
    line-height: 1.3;
    text-shadow:
      0 1px 3px rgba(0, 0, 0, 0.95),
      0 0 12px rgba(0, 0, 0, 0.85);
  }


  /* BOTTOM typography - on cream background, clean */
  .hero-lead{
    max-width: 580px;
    font-size: clamp(1.05rem, 1.4vw, 1.18rem);
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 0.8s forwards;
  }
  .hero-cta{
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0;
    animation: fadeUp 1.2s ease-out 1s forwards;
  }
  .hero-meta{
    margin-top: 40px;
    display: flex;
    gap: 44px;
    flex-wrap: wrap;
    justify-content: center;
    padding-top: 28px;
    border-top: 1px solid var(--line);
    opacity: 0;
    animation: fadeUp 1.2s ease-out 1.2s forwards;
    width: 100%;
    max-width: 600px;
  }
  .hero-meta-item{text-align: center}
  .hero-meta-num{
    font-family: var(--display);
    font-size: 1.5rem;
    color: var(--gold-deep);
    display: block;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .hero-meta-lbl{
    font-family: var(--sans);
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-muted);
  }


  /* ============ BUTTONS ============ */
  .btn{
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 17px 34px;
    font-family: var(--display);
    font-size: 0.78rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    font-weight: 500;
  }
  .btn-primary{
    background: linear-gradient(135deg, var(--gold-deep) 0%, var(--gold) 50%, var(--gold-bright) 100%);
    color: var(--ivory);
    box-shadow: 0 8px 24px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,0.25);
    font-weight: 600;
  }
  .btn-primary::before{
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-bright) 100%);
    opacity: 0;
    transition: opacity 0.4s;
  }
  .btn-primary span{position: relative; z-index: 1}
  .btn-primary:hover{
    transform: translateY(-3px);
    box-shadow: 0 14px 32px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .btn-primary:hover::before{opacity: 1}


  .btn-ghost{
    background: transparent;
    color: var(--gold-deep);
    border: 1px solid var(--gold);
  }
  .btn-ghost:hover{
    background: rgba(184, 146, 74, 0.1);
    border-color: var(--gold-deep);
    color: var(--brown-deep);
    transform: translateY(-2px);
  }


  /* ============ SECTION ============ */
  section{
    padding: 78px 24px;
    position: relative;
  }
  .section-head{
    text-align: center;
    margin-bottom: 48px;
  }
  .section-eyebrow{
    font-family: var(--display);
    font-size: 0.74rem;
    letter-spacing: 0.38em;
    color: var(--gold-deep);
    text-transform: uppercase;
    margin-bottom: 20px;
    display: inline-block;
  }
  .section-eyebrow::before, .section-eyebrow::after{
    content: '—';
    margin: 0 12px;
    color: var(--gold-soft);
  }
  h2{
    font-family: var(--display);
    font-size: clamp(1.9rem, 4vw, 3rem);
    font-weight: 500;
    color: var(--brown-deep);
    letter-spacing: 0.03em;
    line-height: 1.2;
    margin-bottom: 20px;
  }
  h2 em{
    color: var(--gold-deep);
    font-style: italic;
    font-family: var(--serif);
    font-weight: 400;
  }
  .section-lead{
    max-width: 720px;
    margin: 0 auto;
    font-size: 1.12rem;
    color: var(--text-soft);
    line-height: 1.7;
  }


  /* ============ STORY ============ */
  .story{
    background: linear-gradient(180deg, transparent 0%, rgba(237, 224, 196, 0.45) 50%, transparent 100%);
  }
  .story-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
    max-width: 1100px;
    margin: 0 auto;
  }
  .story-visual{
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .story-visual svg{
    width: 100%;
    max-width: 420px;
    height: auto;
    animation: slowRotate 120s linear infinite;
  }
  .story-text p{
    margin-bottom: 22px;
    font-size: 1.1rem;
    line-height: 1.85;
    color: var(--text);
  }
  .story-text p:first-of-type::first-letter{
    font-family: var(--display);
    font-size: 4.2rem;
    float: left;
    line-height: 0.9;
    margin: 8px 12px 0 0;
    color: var(--gold-deep);
  }
  .story-text .highlight{
    color: var(--gold-deep);
    font-style: italic;
    font-weight: 600;
  }


  /* ============ FOR WHO ============ */
  .for-who{
    background: radial-gradient(ellipse at top, rgba(212, 168, 87, 0.1), transparent 60%);
  }
  .for-who-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 36px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .for-who-card{
    background: linear-gradient(145deg, var(--bg-card) 0%, rgba(245, 234, 213, 0.6) 100%);
    border: 1px solid var(--line);
    padding: 50px 44px;
    position: relative;
    transition: all 0.5s ease;
    box-shadow: 0 8px 30px rgba(74, 53, 32, 0.06);
  }
  .for-who-card::before{
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .for-who-card:hover{
    transform: translateY(-6px);
    border-color: var(--gold);
    box-shadow: 0 20px 50px rgba(184, 146, 74, 0.15);
  }
  .for-who-card h3{
    font-family: var(--display);
    font-size: 1.35rem;
    color: var(--brown-deep);
    margin-bottom: 28px;
    letter-spacing: 0.05em;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .for-who-card ul{list-style: none}
  .for-who-card li{
    padding: 12px 0 12px 28px;
    position: relative;
    font-size: 1rem;
    color: var(--text);
    border-bottom: 1px solid var(--line-soft);
  }
  .for-who-card li:last-child{border-bottom: none}
  .for-who-card li::before{
    content: '✧';
    position: absolute;
    left: 0;
    top: 12px;
    color: var(--gold);
    font-size: 0.95em;
  }


  /* ============ GAINS ============ */
  .gains{
    background: linear-gradient(180deg, transparent 0%, rgba(237, 224, 196, 0.4) 100%);
  }
  .gains-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .gain{
    text-align: center;
    padding: 40px 28px;
    background: rgba(253, 248, 236, 0.6);
    border: 1px solid var(--line-soft);
    transition: all 0.4s ease;
  }
  .gain:hover{
    background: var(--bg-card);
    border-color: var(--gold-soft);
    transform: translateY(-4px);
  }
  .gain-icon{
    width: 64px; height: 64px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 168, 87, 0.2), transparent);
    border: 1px solid var(--gold-soft);
  }
  .gain-icon svg{
    width: 28px; height: 28px;
    stroke: var(--gold-deep);
    fill: none;
    stroke-width: 1.5;
  }
  .gain h4{
    font-family: var(--display);
    font-size: 1.02rem;
    color: var(--brown-deep);
    margin-bottom: 14px;
    letter-spacing: 0.06em;
  }
  .gain p{
    font-size: 0.98rem;
    color: var(--text-soft);
    line-height: 1.65;
  }


  /* ============ TESTIMONIALS ============ */
  .testimonials{
    padding: 78px 24px;
    position: relative;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(212, 168, 87, 0.1), transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(181, 154, 118, 0.12), transparent 55%);
  }
  .testimonials-grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .testimonial{
    background: linear-gradient(145deg, var(--bg-card) 0%, rgba(245, 234, 213, 0.55) 100%);
    border: 1px solid var(--line);
    padding: 44px 40px 36px;
    position: relative;
    transition: all 0.5s ease;
    box-shadow: 0 8px 28px rgba(74, 53, 32, 0.06);
    display: flex;
    flex-direction: column;
  }
  .testimonial:hover{
    transform: translateY(-4px);
    border-color: var(--gold-soft);
    box-shadow: 0 20px 45px rgba(184, 146, 74, 0.14);
  }
  .testimonial::before{
    content: '\201E';
    position: absolute;
    top: 8px;
    left: 24px;
    font-family: var(--display);
    font-size: 5.5rem;
    line-height: 1;
    color: var(--gold);
    opacity: 0.22;
    font-weight: 700;
  }
  .testimonial-topic{
    font-family: var(--display);
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line-soft);
    position: relative;
    z-index: 2;
  }
  .testimonial-text{
    font-family: var(--serif);
    font-size: 1.05rem;
    line-height: 1.75;
    color: var(--text);
    font-style: italic;
    margin-bottom: 24px;
    flex-grow: 1;
    position: relative;
    z-index: 2;
  }
  .testimonial-author{
    display: flex;
    align-items: center;
    gap: 14px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .testimonial-initial{
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-deep), var(--gold-bright));
    color: var(--ivory);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-size: 1.1rem;
    font-weight: 600;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(184, 146, 74, 0.25);
  }
  .testimonial-name{
    font-family: var(--display);
    font-size: 0.95rem;
    color: var(--brown-deep);
    letter-spacing: 0.06em;
    font-weight: 500;
  }
  .testimonial-meta{
    font-family: var(--serif);
    font-size: 0.85rem;
    color: var(--text-muted);
    font-style: italic;
    margin-top: 2px;
  }
  /* Featured first testimonial (Martina - vztah s matkou - silný archetypální příběh) */
  .testimonial.featured{
    grid-column: 1 / -1;
    background:
      linear-gradient(145deg, var(--bg-card) 0%, rgba(237, 224, 196, 0.7) 100%);
    border: 1px solid var(--gold);
    padding: 56px 60px 44px;
    position: relative;
  }
  .testimonial.featured::before{
    font-size: 7rem;
    top: 10px;
    left: 36px;
    opacity: 0.28;
  }
  .testimonial.featured .testimonial-text{
    font-size: 1.15rem;
    line-height: 1.8;
  }
  .testimonial-stars{
    display: inline-flex;
    gap: 3px;
    margin-left: auto;
    color: var(--gold);
    font-size: 0.9rem;
    letter-spacing: 2px;
  }


  /* Mini testimonial bar under hero */
  .testimonial-bar{
    padding: 36px 24px;
    background: linear-gradient(90deg, transparent 0%, rgba(184, 146, 74, 0.08) 30%, rgba(184, 146, 74, 0.08) 70%, transparent 100%);
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
    position: relative;
    z-index: 10;
  }
  .testimonial-bar-inner{
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1rem, 1.4vw, 1.18rem);
    color: var(--brown-deep);
    line-height: 1.6;
  }
  .testimonial-bar-author{
    display: block;
    margin-top: 12px;
    font-family: var(--display);
    font-style: normal;
    font-size: 0.72rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-deep);
  }
  .testimonial-bar-author::before{
    content: '— ';
  }


  /* ============ PROCESS ============ */
  .process{
    background: linear-gradient(180deg, transparent 0%, rgba(245, 234, 213, 0.6) 50%, transparent 100%);
  }
  .process-timeline{
    max-width: 800px;
    margin: 0 auto;
    position: relative;
  }
  .process-timeline::before{
    content: '';
    position: absolute;
    left: 31px;
    top: 30px;
    bottom: 30px;
    width: 1px;
    background: linear-gradient(180deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
  }
  .step{
    display: flex;
    gap: 30px;
    margin-bottom: 50px;
    align-items: flex-start;
  }
  .step:last-child{margin-bottom: 0}
  .step-num{
    flex-shrink: 0;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 1px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-size: 1.25rem;
    color: var(--gold-deep);
    position: relative;
    z-index: 2;
    box-shadow: 0 4px 12px rgba(184, 146, 74, 0.12);
  }
  .step-num::after{
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid var(--line);
  }
  .step-body h4{
    font-family: var(--display);
    font-size: 1.22rem;
    color: var(--brown-deep);
    margin-bottom: 10px;
    letter-spacing: 0.04em;
  }
  .step-body p{
    color: var(--text-soft);
    font-size: 1.02rem;
    line-height: 1.7;
  }


  /* ============ RESERVE ============ */
  .reserve{
    padding: 88px 24px;
    position: relative;
  }
  .reserve-card{
    max-width: 760px;
    margin: 0 auto;
    background: linear-gradient(145deg, var(--bg-card) 0%, rgba(245, 234, 213, 0.7) 100%);
    border: 1px solid var(--gold);
    padding: 70px 60px;
    text-align: center;
    position: relative;
    box-shadow:
      0 30px 70px rgba(74, 53, 32, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }
  .reserve-card::before{
    content: '';
    position: absolute;
    inset: -1px;
    background: linear-gradient(135deg, var(--gold-bright), transparent 30%, transparent 70%, var(--gold-bright));
    z-index: -1;
    opacity: 0.4;
  }
  .reserve-ornament{
    display: block;
    width: 62px; height: 62px;
    margin: 0 auto 28px;
    color: var(--gold-deep);
  }
  .reserve-card h2{margin-bottom: 16px}
  .reserve-sub{
    color: var(--text-soft);
    font-size: 1.1rem;
    margin-bottom: 40px;
    font-style: italic;
  }
  .price-block{
    padding: 36px 0;
    margin: 36px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .price-label{
    font-family: var(--display);
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    color: var(--gold-deep);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .price-main{
    font-family: var(--display);
    font-size: 3.2rem;
    color: var(--brown-deep);
    font-weight: 500;
    line-height: 1;
  }
  .price-alt{
    font-family: var(--serif);
    font-size: 1.1rem;
    color: var(--gold-deep);
    margin-top: 8px;
    font-style: italic;
  }
  .price-note{
    font-size: 0.95rem;
    color: var(--text-soft);
    margin-top: 18px;
  }
  .reserve-buttons{
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .reserve-options{
    margin-top: 36px;
    padding-top: 28px;
    border-top: 1px solid var(--line-soft);
    font-size: 0.95rem;
    color: var(--text-soft);
  }
  .reserve-options strong{
    color: var(--brown-deep);
    font-family: var(--display);
    font-size: 0.76rem;
    letter-spacing: 0.2em;
    display: block;
    margin-bottom: 10px;
    font-weight: 500;
  }


  /* ============ FAQ ============ */
  .faq{
    background: linear-gradient(180deg, transparent 0%, rgba(237, 224, 196, 0.35) 100%);
  }
  .faq-list{max-width: 820px; margin: 0 auto}
  .faq-item{
    border-bottom: 1px solid var(--line);
    padding: 26px 0;
    cursor: pointer;
  }
  .faq-q{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    font-family: var(--display);
    font-size: 1.08rem;
    color: var(--brown-deep);
    letter-spacing: 0.02em;
    transition: color 0.3s;
  }
  .faq-q:hover{color: var(--gold-deep)}
  .faq-toggle{
    flex-shrink: 0;
    width: 28px; height: 28px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold-deep);
    font-size: 1.1rem;
    transition: all 0.3s;
  }
  .faq-item.open .faq-toggle{
    background: var(--gold);
    color: var(--ivory);
    transform: rotate(45deg);
  }
  .faq-a{
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s ease, padding 0.3s ease;
    color: var(--text-soft);
    line-height: 1.75;
    font-size: 1.02rem;
  }
  .faq-item.open .faq-a{
    max-height: 400px;
    padding-top: 18px;
  }


  /* ============ FINAL CTA ============ */
  .final-cta{
    padding: 96px 24px;
    text-align: center;
    position: relative;
  }
  .final-cta::before{
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(212, 168, 87, 0.15), transparent 60%);
    pointer-events: none;
  }
  .final-cta h2{
    max-width: 760px;
    margin: 0 auto 24px;
  }
