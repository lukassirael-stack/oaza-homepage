<style>
:root{
  --les:#f6f0e2; --krem:#1d3b30; --sed:#6e8076;
  --zlata:#a8813a; --lesk:#f0d9a4;
  --plocha:rgba(255,255,255,.90);
  --linka:rgba(168,129,58,.24);
}


/* ---------- navigační lišta Oázy (převzatá 1:1 z ostatních stránek) ---------- */
nav{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:flex-end;gap:34px;padding:26px 48px 60px}
nav .menu{display:flex;gap:26px;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;font-family:'Jost',sans-serif;color:var(--krem)}
nav .menu a{position:relative;padding-bottom:3px;color:var(--krem);text-decoration:none}
nav .menu a::after{display:none}
nav .menu a:hover{color:var(--zlata)}
nav .nav-home{margin-right:auto;display:flex;align-items:center;color:var(--krem);transition:color .25s}
nav .nav-home:hover{color:var(--zlata)}
.nav-toggle{display:none;background:none;border:none;color:var(--krem);font-size:30px;cursor:pointer}
nav .btn{font-family:'Cormorant Garamond',serif;font-size:18px;padding:11px 26px;display:inline-block;background:#b06a6c;color:#fdfaf5;border-radius:6px;text-decoration:none;transition:background .25s}
nav .btn:hover{background:#9c585a}
.jen-mobil{display:none}
@media(max-width:900px){
  nav{padding:20px 22px;gap:20px}
  nav .menu{display:none;position:fixed;inset:0;background:#15221a;flex-direction:column;padding:96px 28px 40px;gap:0;text-align:left;z-index:50;overflow-y:auto}
  nav .menu.open{display:flex}
  nav .menu a{font-size:25px;color:#f3efe5;padding:21px 4px;border-bottom:1px solid rgba(243,239,229,.14)}
  nav .menu a::after{display:none}
  .jen-mobil{display:block}
  .nav-toggle{display:block;position:relative;z-index:60}
  nav .btn:not(.jen-mobil){display:none}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--les)}
body{
  background:transparent;color:var(--krem);
  font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.6;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
/* krystalové pozadí — stejné jako v aplikaci */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;transform:translateZ(0);
  background:
    linear-gradient(to bottom, rgba(246,240,226,0) 0%, rgba(246,240,226,0) 42%,
      rgba(246,240,226,.22) 64%, rgba(246,240,226,.5) 84%, rgba(246,240,226,.7) 100%),
    url("https://ladeni.oaza-adamanthea.cz/hero-svetly.webp") center top/cover no-repeat,
    var(--les);
}
a{color:var(--zlata);text-decoration:none}
.obal{max-width:900px;margin:0 auto;padding:0 1.2rem}


/* hlavička */
header{text-align:center;padding:104px 1.2rem 1.2rem}
@media(max-width:900px){header{padding-top:60px}}
/* Světelný kruh má vlastní blok: značka, název a podtitul sedí uvnitř,
   všechno ostatní začíná až pod ním. Prstenec tak nikdy neprotne text. */
.kruhBlok{
  position:relative;isolation:isolate;margin:0 auto;
  height:clamp(300px,40vw,400px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;
}
/* Kruh je větší než rezervovaný blok a smí přes něj měkce přetékat —
   prstenec tak obejme i široký nadpis, aniž by hlavička narostla do výšky. */
.kruhBlok::before{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translateZ(0);
  will-change:transform;backface-visibility:hidden;
  width:clamp(460px,80vw,730px);aspect-ratio:1;z-index:-1;pointer-events:none;
  background:url("https://ladeni.oaza-adamanthea.cz/hero-svetly-kruh.webp") center/contain no-repeat;
  /* spodní záře se rozpustí, aby nevymývala odstavec pod kruhem */
  -webkit-mask-image:linear-gradient(to bottom,#000 52%,rgba(0,0,0,.5) 74%,rgba(0,0,0,.12) 88%,transparent 97%);
  mask-image:linear-gradient(to bottom,#000 52%,rgba(0,0,0,.5) 74%,rgba(0,0,0,.12) 88%,transparent 97%);
}
/* texty uvnitř záře potřebují víc kontrastu */
.kruhBlok .znacka{color:#6f5522}
.kruhBlok .podtitul{color:#4e6156}
@media(max-width:560px){
  /* Kruh je krásný, ale na telefonu tlačil výzvu pod ohyb obrazovky.
     Menší blok ji vytáhne nahoru, prstenec drží stejný poměr. */
  .kruhBlok{height:min(70vw,360px)}
  .kruhBlok::before{width:min(108vw,530px)}
}
.znacka{font-family:'Jost',sans-serif;font-weight:300;font-size:.78rem;letter-spacing:.34em;text-transform:uppercase;color:var(--zlata)}
h1{font-family:'Cinzel',serif;font-weight:500;font-size:clamp(2.2rem,6.5vw,3.3rem);letter-spacing:.09em;margin:.7rem 0 .45rem}
.podtitul{font-style:italic;font-size:1.14rem;color:var(--sed)}
.uvodni{max-width:36rem;margin:1.6rem auto 0}
.cta{margin-top:1.4rem;display:flex;gap:.9rem;justify-content:center;align-items:center;flex-wrap:wrap}
/* malý podtitulek uvnitř tlačítka — „zdarma“ pod hlavním popiskem */
.tl small{display:block;margin-top:.3rem;font-size:.62rem;letter-spacing:.22em;opacity:.75;text-transform:uppercase}


/* tlačítka s leskem jako v aplikaci */
.tl{
  display:inline-block;font-family:'Jost',sans-serif;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;
  padding:1rem 2.1rem;border-radius:999px;cursor:pointer;
  background-repeat:no-repeat;background-size:210% 100%,100% 100%;background-position:-75% 0,0 0;
  transition:transform .3s cubic-bezier(.2,.8,.3,1),box-shadow .3s,background-position 1.9s cubic-bezier(.22,.6,.25,1),background-color .4s;
}
.tl-plna{
  background-image:
    linear-gradient(104deg,transparent 32%,rgba(240,217,164,.30) 46%,rgba(240,217,164,.55) 50%,rgba(240,217,164,.30) 54%,transparent 68%),
    linear-gradient(163deg,rgba(255,255,255,.12) 0%,transparent 60%);
  background-color:#1d3b30;color:#fbf7ef;border:1px solid #1d3b30;
  box-shadow:0 14px 30px -18px rgba(29,59,48,.6);
}
.tl-obrys{
  background-image:
    linear-gradient(104deg,transparent 32%,color-mix(in srgb,var(--lesk) 55%,transparent) 45%,color-mix(in srgb,var(--lesk) 88%,transparent) 50%,color-mix(in srgb,var(--lesk) 55%,transparent) 55%,transparent 68%),
    linear-gradient(163deg,rgba(255,255,255,.9) 0%,transparent 62%);
  background-color:var(--plocha);color:var(--zlata);border:1px solid var(--zlata);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 26px -18px rgba(29,59,48,.4);
}
.tl:hover{transform:translateY(-3px);background-position:175% 0,0 0}
.tl-obrys:hover{background-color:color-mix(in srgb,var(--lesk) 26%,#fffdf7)}
.tl:active{transform:translateY(-1px)}


section{padding:2rem 0}
h2{font-family:'Cinzel',serif;font-weight:500;font-size:1.5rem;letter-spacing:.07em;margin-bottom:.9rem;text-align:center}
.stred{text-align:center;max-width:38rem;margin:0 auto;color:var(--sed)}
.oddel{height:1px;background:linear-gradient(90deg,transparent,var(--linka),transparent);max-width:520px;margin:0 auto}


/* hlavní heslo — stejná velikost jako text, jen s uvozovkami */
.heslo{
  max-width:34rem;margin:1.4rem auto 0;
  font-style:italic;color:#2a4a3e;
  text-shadow:0 1px 0 rgba(255,253,247,.7);
}
.heslo q{quotes:"\201E" "\201C"}
.heslo q::before,.heslo q::after{color:color-mix(in srgb,var(--zlata) 70%,transparent)}


/* rychlé odrážky pod hero */
.rychle{
  display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem;
  font-family:'Jost',sans-serif;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--zlata);
}
.rychle span{
  border:1px solid color-mix(in srgb,var(--zlata) 30%,transparent);border-radius:999px;
  padding:.38rem .95rem;background:rgba(255,252,245,.82);
}
/* kdy pomůže */
.situace{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:.9rem;margin-top:1.9rem}
.situ{
  display:flex;gap:.9rem;align-items:flex-start;
  border-radius:14px;padding:1.15rem 1.2rem;
  background-image:linear-gradient(163deg,rgba(255,252,244,.92) 0%,transparent 74%);
  background-color:rgba(255,252,245,.97);
  border:1px solid color-mix(in srgb,var(--zlata) 26%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,253,247,.9),0 12px 24px -18px rgba(45,60,45,.4);
}
.situTecka{
  flex:none;width:.6rem;height:.6rem;border-radius:50%;margin-top:.55rem;
  background:var(--tb,#c9a14a);box-shadow:0 0 10px 1px color-mix(in srgb,var(--tb,#c9a14a) 55%,transparent);
}
.situ b{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.08rem;margin-bottom:.15rem}
.situ span.p{color:var(--sed);font-size:.98rem;line-height:1.45}
.situ span.p em{font-style:normal;color:var(--zlata)}


/* tři pilíře */
.pilire{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.2rem;margin-top:2rem}
.pilir{
  position:relative;border-radius:18px;padding:1.8rem 1.5rem 1.5rem;
  background-image:linear-gradient(163deg,rgba(255,252,244,.95) 0%,rgba(255,250,240,.6) 42%,transparent 76%);
  background-color:rgba(255,252,245,.97);
  border:1px solid color-mix(in srgb,var(--zlata) 30%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,253,247,.95),0 18px 34px -22px rgba(45,60,45,.45),0 3px 8px -5px rgba(70,55,25,.14);
}
.pilirCislo{
  display:inline-flex;align-items:center;justify-content:center;width:2.1rem;height:2.1rem;
  border-radius:50%;margin-bottom:.8rem;
  font-family:'Cinzel',serif;font-size:.95rem;color:#fffdf7;
  background:linear-gradient(150deg,#c9a14a,#a8813a);
  box-shadow:0 6px 14px -8px rgba(45,60,45,.5),inset 0 1px 0 rgba(255,255,255,.5);
}
.pilir h3{font-family:'Cinzel',serif;font-weight:500;font-size:1.2rem;letter-spacing:.05em;margin-bottom:.5rem}
.pilir p{font-size:1.01rem;line-height:1.55;color:var(--sed)}
.pilir p + p{margin-top:.6rem}
.pilirZamer{
  margin-top:2rem;text-align:center;max-width:40rem;margin-left:auto;margin-right:auto;
  font-style:italic;color:var(--sed);font-size:1.05rem;line-height:1.6;
}


/* karty programů — plastické jako v aplikaci */
.programy{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:1rem;margin-top:1.8rem}
.program{
  position:relative;overflow:hidden;border-radius:14px;padding:1.45rem 1.3rem 1.3rem;
  background-image:
    linear-gradient(104deg,transparent 32%,color-mix(in srgb,var(--lesk) 55%,transparent) 45%,color-mix(in srgb,var(--lesk) 88%,transparent) 50%,color-mix(in srgb,var(--lesk) 55%,transparent) 55%,transparent 68%),
    linear-gradient(163deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.55) 38%,transparent 72%);
  background-color:rgba(255,255,255,.97);
  background-repeat:no-repeat;background-size:210% 100%,100% 100%;background-position:-75% 0,0 0;
  border:1px solid color-mix(in srgb,var(--zlata) 30%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 16px 30px -20px rgba(29,59,48,.45),0 4px 10px -6px rgba(29,59,48,.14);
  transition:transform .3s cubic-bezier(.2,.8,.3,1),box-shadow .3s,background-position 1.9s cubic-bezier(.22,.6,.25,1),background-color .4s;
}
.program:hover{
  transform:translateY(-5px);background-position:175% 0,0 0;
  background-color:color-mix(in srgb,var(--lesk) 26%,#fffdf7);
  box-shadow:inset 0 1px 0 #fff,0 28px 46px -22px rgba(29,59,48,.5),0 6px 16px -8px rgba(29,59,48,.18);
}
.pruh{position:absolute;top:0;left:0;right:0;height:4px;z-index:1;opacity:.92}
.pruh::after{content:"";position:absolute;left:-6%;right:-6%;top:0;height:30px;background:inherit;filter:blur(13px);opacity:.5}
.program .fr{font-family:'Jost',sans-serif;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--zlata);display:block;margin-bottom:.3rem}
.program h3{font-family:'Cinzel',serif;font-weight:500;font-size:1.08rem;letter-spacing:.04em;margin-bottom:.4rem}
.program p{font-size:1rem;color:var(--sed);line-height:1.5}


/* střídmý výčet programů */
.vypis{list-style:none;margin:1.7rem 0 0;padding:0;
  border-top:1px solid color-mix(in srgb,var(--zlata) 18%,transparent)}
.vypis li{
  display:grid;grid-template-columns:.7rem minmax(9rem,auto) minmax(8rem,auto) 1fr;
  gap:.5rem 1rem;align-items:baseline;
  padding:.85rem .2rem;border-bottom:1px solid color-mix(in srgb,var(--zlata) 16%,transparent);
}
.vypis .tec{width:.6rem;height:.6rem;border-radius:50%;align-self:center;
  box-shadow:0 0 8px 1px rgba(0,0,0,.06)}
.vypis b{font-family:'Cinzel',serif;font-weight:500;font-size:1.02rem;letter-spacing:.03em}
.vypis i{font-family:'Jost',sans-serif;font-style:normal;font-size:.68rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--zlata)}
.vypis span:last-child{color:var(--sed);font-size:.98rem;line-height:1.4}
@media(max-width:660px){
  .vypis li{grid-template-columns:.7rem 1fr;gap:.25rem .8rem}
  .vypis i{grid-column:2}
  .vypis span:last-child{grid-column:2}
}


/* cenovka */
.cenovka{
  position:relative;isolation:isolate;
  max-width:34rem;margin:2.4rem auto 0;border-radius:22px;padding:2.4rem 2rem 2.2rem;text-align:center;
  background-image:
    radial-gradient(120% 80% at 50% -10%, rgba(240,217,164,.5) 0%, rgba(255,253,247,0) 62%),
    linear-gradient(163deg,rgba(255,255,255,.97) 0%,rgba(255,252,243,.78) 42%,rgba(255,249,236,.6) 100%);
  background-color:rgba(255,253,247,.97);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -26px 46px -34px rgba(201,161,74,.5),
    0 30px 60px -30px rgba(29,59,48,.42),
    0 0 60px -14px rgba(201,161,74,.34);
}
/* zlatý prstenec po obvodu — svítí, nekreslí tvrdou linku */
.cenovka[data-typ]{cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.3,1),box-shadow .3s}
.cenovka[data-typ]:hover,.cenovka[data-typ]:focus-visible{transform:translateY(-6px)}
.cenovka[data-typ]:focus-visible{outline:2px solid #c9a14a;outline-offset:4px}
.cenovkaVolba{
  display:inline-block;margin-top:1.15rem;
  font-family:'Jost',sans-serif;font-weight:500;font-size:.66rem;
  letter-spacing:.2em;text-transform:uppercase;color:#a8813a;
  border:1px solid rgba(201,161,74,.5);border-radius:999px;padding:.46rem 1rem;
  transition:background .25s,border-color .25s,color .25s;
}
.cenovka[data-typ]:hover .cenovkaVolba,.cenovka[data-typ]:focus-visible .cenovkaVolba{
  background:rgba(201,161,74,.14);border-color:#c9a14a;color:#8a6a2e;
}
.cenovka::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:-1;
  background:linear-gradient(150deg,#f4e2b8,#c9a14a 32%,#f7ecd2 55%,#b8903f 78%,#f4e2b8);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;
}
/* měkká záře pod kartou, ať neleží na pozadí jako papír */
.cenovka::after{
  content:"";position:absolute;left:50%;top:-14%;transform:translateX(-50%);
  width:88%;height:130%;z-index:-2;pointer-events:none;
  background:radial-gradient(closest-side,rgba(240,217,164,.55),rgba(240,217,164,0) 72%);
  filter:blur(6px);
}
.zavadeci{
  display:inline-block;margin-bottom:.9rem;
  font-family:'Jost',sans-serif;font-size:.68rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
  color:#8a6626;padding:.42rem 1.05rem;border-radius:999px;
  background:linear-gradient(120deg,rgba(240,217,164,.5),rgba(255,249,232,.75));
  border:1px solid rgba(201,161,74,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}
.zavadeciPozn{
  margin-top:1.3rem;padding-top:1.1rem;font-size:.98rem;line-height:1.5;color:var(--sed);
  border-top:1px solid rgba(201,161,74,.22);
}
.zavadeciPozn b{color:#8a6626;font-weight:600}
.cena{
  font-family:'Cinzel',serif;font-size:2.7rem;letter-spacing:.02em;line-height:1.15;
  background:linear-gradient(100deg,#8a6626 0%,#a8813a 30%,#c9a14a 50%,#a8813a 70%,#8a6626 100%);
  background-size:230% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:lesknuti 7s ease-in-out infinite;
}
@keyframes lesknuti{0%,100%{background-position:0 0}50%{background-position:100% 0}}
@media(prefers-reduced-motion:reduce){.cena{animation:none}}
.cena small{
  font-family:'Jost',sans-serif;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--sed);display:block;margin-top:.5rem;
  -webkit-text-fill-color:var(--sed);
}
/* vlásková zlatá linka mezi cenou a výčtem */
.cenovka ul{
  list-style:none;margin:1.5rem 0 0;padding-top:1.4rem;text-align:left;display:inline-block;
  position:relative;
}
.cenovka ul::before{
  content:"";position:absolute;top:0;left:50%
