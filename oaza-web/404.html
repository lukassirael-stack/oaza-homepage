<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tudy vede cesta dál | Oáza Adamanthea</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--cream:#f5f1e9;--green:#2e4434;--ink:#3a3f38;--line:#d8d0c2;--gold:#bca060}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);
    color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-weight:300;line-height:1.6;padding:40px 20px}
  main{max-width:620px;text-align:center}
  .znak{color:var(--gold);font-size:2rem}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--green);font-size:clamp(2.2rem,6vw,3.2rem);line-height:1.1;margin:.3em 0 .3em}
  p{font-size:1.08rem;margin:0 auto 28px;max-width:460px}
  nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:26px}
  nav a{display:block;padding:14px 12px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;color:var(--green);
    text-decoration:none;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.2rem;transition:border-color .2s}
  nav a:hover,nav a:focus-visible{border-color:var(--gold);outline:none}
  .domu{display:inline-block;padding:12px 28px;border-radius:999px;background:var(--green);color:var(--cream);text-decoration:none;letter-spacing:.04em}
  .domu:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="znak">✦</div>
  <h1>Tudy vede cesta dál</h1>
  <p>Oáza má nový domov na oaza-adamanthea.cz. Vyber si, kam tě to táhne:</p>
  <nav>
    <a href="/nabidka-sluzeb">Nabídka služeb</a>
    <a href="/terapie-v-oaze">Terapie v Oáze</a>
    <a href="/akce">Akce a semináře</a>
    <a href="/pobyt-ve-svetle">Pobyt ve světle</a>
    <a href="/portalova-zahrada">Portálová zahrada</a>
    <a href="/bali-shop">Bali Shop</a>
  </nav>
  <a class="domu" href="/">Na úvodní stránku</a>
</main>
<script defer src="/navstevnost.js"></script>
</body>
</html>
