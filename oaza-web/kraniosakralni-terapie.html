<style>

  color: var(--ink);
}

/* === DEKORATIVNÍ POZADÍ === */
.oa-landing::before {
  content: '';

  pointer-events: none;
  z-index: 0;
  filter: blur(40px);
}
.oa-landing::after {
  content: '';
  position: absolute;
  bottom: 20%; right: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(201, 161, 74, 0.22), transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(50px);
}

    radial-gradient(ellipse at bottom right, rgba(201, 161, 74, 0.18) 0%, transparent 60%),
    linear-gradient(180deg, var(--cream) 0%, var(--cream-warm) 50%, var(--cream) 100%);
  background-size: auto, auto, auto;
  background-position: 0 0, 0 0, 0 0, 0 0;
}


.oa-ornaments {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
}
.oa-ornaments svg {
  position: absolute;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.oa-corner-tr { top: 0; right: 0; width: 280px; height: 280px; opacity: 0.45; transform: scaleX(-1); }
.oa-corner-bl { bottom: 0; left: 0; width: 280px; height: 280px; opacity: 0.40; transform: scaleY(-1); }
.oa-corner-br { bottom: 0; right: 0; width: 280px; height: 280px; opacity: 0.40; transform: scale(-1, -1); }

.oa-mandala-2 { top: 65%; right: -140px; width: 360px; height: 360px; opacity: 0.18; animation: oaRotate 100s linear infinite reverse; }


@keyframes oaRotate {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.oa-corner-tr { animation: none; }
.oa-corner-bl { animation: none; }
.oa-corner-br { animation: none; }

  font-size: 15px;
  letter-spacing: 0.2em;
  margin-bottom: 8px;
}


.oa-process-content h3 {
  font-size: clamp(1.8rem, 3vw, 2.4rem);
  margin-bottom: 24px;
  color: var(--gold-deep);
}
.oa-process-content p {
  font-size: 1.08rem;
  color: var(--ink-soft);
  line-height: 1.9;
  margin-bottom: 16px;
}
.oa-process-content .oa-quote {
  font-style: italic;
  color: var(--rose-deep);
  font-size: 1.15rem;
  border-left: 3px solid var(--gold);
  padding-left: 20px;
  margin-top: 24px;
  line-height: 1.7;
}


/* === O MARTINĚ === */
.oa-about {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(249, 221, 226, 0.5) 100%);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1.5px solid rgba(201, 161, 74, 0.3);
  border-radius: 28px;
  padding: 52px 44px;
  position: relative;
  box-shadow: 0 30px 60px -20px rgba(184, 80, 104, 0.15);
}
.oa-about h2 {
  font-size: clamp(2rem, 3.2vw, 2.6rem);
  text-align: center;
  margin-bottom: 10px;
  color: var(--ink);
}
.oa-about-sub {
  text-align: center;
  font-style: italic;
  color: var(--rose-deep);
  margin-bottom: 32px;
  font-size: 1.2rem;
  letter-spacing: 0.04em;
}
.oa-about p {
  color: var(--ink-soft);
  margin-bottom: 18px;
  line-height: 1.85;
  font-size: 1.04rem;
}


/* === CENA === */
.oa-price-block {
  text-align: center;
  margin: 16px auto;
  padding: 44px 32px;
  max-width: 580px;
  background: linear-gradient(135deg, var(--white) 0%, var(--rose-blush) 100%);
  border-radius: 28px;
  border: 2px solid var(--gold-light);
  position: relative;
  box-shadow:
    0 30px 60px -20px rgba(184, 80, 104, 0.25),
    inset 0 0 0 1px rgba(255, 255, 255, 0.6);
}
.oa-price-block::before {
  content: '';
  position: absolute;
  inset: 12px;
  border: 1px solid var(--gold);
  border-radius: 18px;
  pointer-events: none;
  opacity: 0.5;
}
.oa-price-label {
  font-size: 12.5px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--rose-deep);
  margin-bottom: 18px;
  font-weight: 600;
}
.oa-price {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3.6rem;
  font-weight: 400;
  background: linear-gradient(135deg, var(--gold-deep), var(--rose-deep));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 0.02em;
  line-height: 1.1;
}
.oa-price .oa-price-alt {
  font-size: 1.6rem;
  color: var(--gold-deep);
  margin-left: 14px;
  font-style: italic;
  -webkit-text-fill-color: var(--gold-deep);
}
.oa-price-note {
  margin-top: 16px;
  font-size: 0.98rem;
  color: var(--ink-soft);
  font-style: italic;
}


/* === CTA === */
.oa-cta-section {
  text-align: center;
  padding: 48px 32px 48px;
}
.oa-cta-section h2 {
  font-size: clamp(2rem, 3.5vw, 2.8rem);
  margin-bottom: 18px;
  background: linear-gradient(135deg, var(--rose-deep), var(--gold-deep));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.oa-cta-section p {
  color: var(--ink-soft);
  font-style: italic;
  font-size: 1.15rem;
  margin-bottom: 32px;
  max-width: 580px;
  margin-left: auto;
  margin-right: auto;
}


.oa-btn {
  display: inline-block;
  padding: 20px 52px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 50%, var(--rose-deep) 100%);
  background-size: 200% 100%;
  background-position: 0% 0%;
  color: var(--white);
  text-decoration: none;
  border-radius: 100px;
  font-family: 'Cardo', serif;
  font-size: 1rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  transition: background-position 0.6s ease, transform 0.3s ease, box-shadow 0.3s ease;
  position: relative;
  overflow: hidden;
  box-shadow: 0 14px 36px rgba(184, 80, 104, 0.4);
  font-weight: 700;
}


.oa-btn:hover {
  transform: translateY(-3px);
  background-position: 100% 0%;
  box-shadow: 0 20px 48px rgba(184, 80, 104, 0.55);
}


.oa-btn::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transition: left 0.7s ease;
}


.oa-btn:hover::after { left: 100%; }


.oa-btn-secondary {
  display: inline-block;
  margin-left: 16px;
  padding: 20px 40px;
  background: transparent;
  color: var(--rose-deep);
  text-decoration: none;
  border-radius: 100px;
  font-family: 'Cardo', serif;
  font-size: 0.95rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border: 1.5px solid var(--rose);
  transition: all 0.3s ease;
  font-weight: 600;
}
.oa-btn-secondary:hover {
  background: rgba(217, 122, 142, 0.12);
  border-color: var(--rose-deep);
  transform: translateY(-2px);
}


/* === FORMULÁŘ MODAL === */
.oa-form-overlay {
  position: fixed;
  inset: 0;
  background: rgba(61, 40, 50, 0.75);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
  animation: oaFadeIn 0.3s ease;
}
.oa-form-overlay.active { display: flex; }


@keyframes oaFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}


.oa-form-box {
  background: var(--cream);
  border-radius: 28px;
  padding: 52px 44px;
  max-width: 540px;
  width: 100%;
  position: relative;
  box-shadow: 0 40px 100px rgba(0,0,0,0.35);
  border: 2px solid var(--gold-light);
  max-height: 90vh;
  overflow-y: auto;
}
.oa-form-close {
  position: absolute;
  top: 16px; right: 22px;
  background: none;
  border: none;
  font-size: 32px;
  color: var(--rose-deep);
  cursor: pointer;
  line-height: 1;
  font-family: serif;
  transition: transform 0.2s;
}
.oa-form-close:hover { transform: rotate(90deg); }


.oa-form-box h3 {
  font-size: 1.8rem;
  margin-bottom: 8px;
  color: var(--ink);
}
.oa-form-box .oa-form-sub {
  font-style: italic;
  color: var(--ink-soft);
  margin-bottom: 32px;
  font-size: 0.98rem;
}
.oa-form-field {
  margin-bottom: 20px;
}
.oa-form-field label {
  display: block;
  font-size: 11.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--rose-deep);
  margin-bottom: 8px;
  font-weight: 600;
}
.oa-form-field input,
.oa-form-field textarea {
  width: 100%;
  padding: 14px 18px;
  border: 1.5px solid rgba(201, 161, 74, 0.3);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.85);
  font-family: 'Cardo', serif;
  font-size: 1rem;
  color: var(--ink);
  transition: all 0.3s;
}
.oa-form-field input:focus,
.oa-form-field textarea:focus {
  outline: none;
  border-color: var(--gold);
  background: var(--white);
  box-shadow: 0 0 0 4px rgba(201, 161, 74, 0.12);
}
.oa-form-field textarea {
  min-height: 110px;
  resize: vertical;
  font-family: 'Cardo', serif;
}
.oa-form-submit {
  width: 100%;
  padding: 18px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--rose-deep) 100%);
  color: var(--white);
  border: none;
  border-radius: 100px;
  font-family: 'Cardo', serif;
  font-size: 0.98rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 14px;
  transition: transform 0.3s, box-shadow 0.3s;
  font-weight: 700;
}
.oa-form-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 32px rgba(184, 80, 104, 0.35);
}


/* === FOOTER === */
.oa-footer-note {
  text-align: center;
  padding: 28px 32px 56px;
  font-style: italic;
  color: var(--gold-deep);
  font-size: 1.08rem;
  letter-spacing: 0.1em;
  opacity: 0.85;
}
